version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for all Spring Boot modules; they must move together
      spring:
        patterns:
            - "org.springframework*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
        interval: monthly